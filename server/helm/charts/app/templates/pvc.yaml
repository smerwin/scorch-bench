apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "scorch.fullname" . }}-data
  labels:
    {{- include "scorch.labels" . | nindent 4 }}
  annotations:
    # Keep agents and ratings if the release is ever uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
